<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Logger</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Log Expense</h2>

  <label>Description</label>
  <input type="text" id="description" required>

  <label>Amount</label>
  <input type="number" id="amount" required>

  <label>Who</label>
  <select id="who">
    <option value="">Select</option>
    <option value="Me">Me</option>
    <option value="Wife">Wife</option>
  </select>

  <label>Tag</label>
  <select id="tag">
    <option value="Need">Need</option>
    <option value="Want">Want</option>
    <option value="Investment">Investment</option>
  </select>

  <button onclick="submitForm()">Submit</button>

  <script>
    // Pre-fill 'Who' from localStorage if saved
    const savedWho = localStorage.getItem("who");
    if (savedWho) {
      document.getElementById("who").value = savedWho;
    }

    // Save 'Who' after first selection
    document.getElementById("who").addEventListener("change", function () {
      localStorage.setItem("who", this.value);
    });

    function submitForm() {
      const description = document.getElementById("description").value;
      const amount = document.getElementById("amount").value;
      const who = document.getElementById("who").value;
      const tag = document.getElementById("tag").value;

      if (!description || !amount || !who || !tag) {
        alert("Please fill all fields.");
        return;
      }

      // Send data to Apps Script
      fetch("https://script.google.com/macros/s/AKfycbxKFU_MnJZE8NDTaFpOlxd0E4n-SozXlyaeHlIIuc-TnTM1XLeSzgxfNkaEbL0RwQ9uPg/exec", {
        method: "POST",
        body: JSON.stringify({
          description,
          amount,
          who,
          tag
        }),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(response => response.text())
      .then(data => {
        alert("Expense submitted!");
        // Clear the form
        document.getElementById("description").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("tag").value = "Need";
      })
      .catch(error => {
        alert("Error submitting: " + error);
      });
    }
  </script>
</body>
</html>
